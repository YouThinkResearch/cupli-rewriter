name: Terraform apply (selectel-relay)

# The EdgeCenter jobs (edgecenter-relay, prosto, u-survey) were removed when the
# EdgeCenter account was lost on 2026-11-05; their resources no longer exist.
on:
  workflow_dispatch:

jobs:
  # yandex-relay/ died with Yandex ru-central1-a on 2026-10-11; the relay now lives
  # on Selectel. Manual-only, like the Yandex job was: an apply rewrites live config.
  selectel-relay:
    name: Terraform apply (selectel-relay, u-survey.ru)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_selectel_api_token: ${{ secrets.SELECTEL_API_TOKEN }}
      TF_VAR_cloudflare_api_key: ${{ secrets.CLOUDFLARE_CUPLI_API_KEY }}
      TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_CUPLI_EMAIL }}
      TF_VAR_explorer_password: ${{ secrets.EXPLORER_APP_PASSWORD }}
      TF_VAR_explorer_session_secret: ${{ secrets.EXPLORER_SESSION_SECRET }}
      TF_VAR_ssh_private_key: ${{ github.workspace }}/id_relay
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # null_resource.deploy builds the bundle with `bun build.ts` before pushing it.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install rewriter dependencies
        working-directory: rewriter
        run: bun install --frozen-lockfile
      - name: Materialise credentials
        run: |
          printf '%s\n' '${{ secrets.RELAY_SSH_PRIVATE_KEY }}' > "$TF_VAR_ssh_private_key"
          chmod 600 "$TF_VAR_ssh_private_key"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
      - name: Terraform init
        working-directory: selectel-relay
        run: terraform init -input=false
      - name: Terraform apply
        working-directory: selectel-relay
        run: terraform apply -input=false -auto-approve
      - name: Scrub credentials
        if: always()
        run: rm -f "$TF_VAR_ssh_private_key"
